# 报表指纹种子（识别器配置 · 数据驱动，Q3 决议）
# 阶段一种子：亚马逊广告控制台 bulk 下载·英文列名（SP 全类型 + campaign 通用骨架含 SB）。
# 校准记录（O-1，2026-11-14）：依 samples/raw-reports 真实表头校准——
#   1) 后台下载报表无 Campaign Id / Ad Group Id / Keyword Id 列，以 Campaign Name /
#      Ad Group Name 作业务键（canonical 列沿用 campaign_id/adgroup_id 装 name，
#      lineage 记录来源列）；
#   2) SP Targeting 报表特征列 = Top-of-search Impression Share（区分 vs adgroup）；
#   3) campaign/placement/target 的 negative 增加 advertised asin/sku，防止与
#      advertised_product 并列满分；
#   4) 领星中文报表与本地清洗派生 csv 不在本版覆盖范围（D11：后续增补适配器）。
# 校准记录（O-1 增补 2，2026-11-14）：依 reports/广告投放报表 真实表头增补领星 ERP 适配（D11 一期）——
#   5) 「每周投放报告-每日明细」（24 列中文，含「日期」列）经 report_variants 映射为
#      target 类型进 can_target（混合 SP/SB 行由适配器按「类型」列逐行分派 ad_product_type）；
#   6) 领星「汇总」版（关键词/广告位报告）无「日期」列，仍按设计拒绝（周期聚合口径，D11 二期再议）；
#   7) 本地清洗派生 csv（snake_case 列）靠归一化下划线可被正确排除判定，
#      但其「campaign」裸列名仍不满足 campaign name 组 → 维持 unknown（该数据与已导入的
#      amazon_console 批次同源重复，无独立入账价值）。
#
# 结构约定：
#   required:  必要列组列表；组内 any_of=命中任一即通过，all_of=全命中才通过
#   distinguishing: 区分列（加分项），any_of
#   negative:  排除列组列表，组内任一命中则该类型判 unknown
#   列名匹配前统一归一化：去 BOM → strip → 连续空白折叠为单空格 → 小写
# 归因窗：从列名中的 "n day" 前缀推断（7/14/30），跳过 '1 day' 点击窗，取首个转化窗

version: 1

# 领星 ERP 中文别名（映射进 metric 体系，供适配器取数；识别匹配用 report_variants 的字面列名）
#   注：领星「点击」列无量词后缀、「花费/销售额」带「-本币」后缀；「销量」区分广告销量（units）
metric_aliases:
  impressions: ["impressions", "曝光量"]
  clicks: ["clicks", "点击", "点击量"]
  spend: ["spend", "cost", "花费-本币", "花费", "花费-美元"]
  orders: ["orders", "7 day total orders (#)", "14 day total orders (#)", "30 day total orders (#)", "广告订单"]
  sales: ["sales", "7 day total sales", "14 day total sales", "30 day total sales", "广告销售额-本币", "广告销售额", "广告销售额-美元"]
  units: ["units", "7 day total units (#)", "14 day total units (#)", "30 day total units (#)", "广告销量"]

report_types:
  campaign:
    required:
      - any_of: ["date", "start date"]
      - any_of: ["campaign id", "campaign name"]
      - all_of: ["impressions", "clicks"]
      - any_of: ["spend", "cost"]
    distinguishing:
      - any_of: ["portfolio name"]
    negative:
      - ["ad group id", "ad group name", "customer search term", "placement",
         "keyword or product targeting", "targeting", "advertised asin", "advertised sku",
         "purchased asin", "other asin"]

  adgroup:
    required:
      - any_of: ["date", "start date"]
      - any_of: ["campaign id", "campaign name"]
      - any_of: ["ad group id", "ad group name"]
      - all_of: ["impressions", "clicks"]
      - any_of: ["spend", "cost"]
    distinguishing:
      - any_of: ["ad group name"]
    negative:
      - ["customer search term", "keyword or product targeting", "targeting",
         "advertised asin", "advertised sku"]

  target:
    required:
      - any_of: ["date", "start date"]
      - any_of: ["campaign id", "campaign name"]
      - any_of: ["ad group id", "ad group name"]
      - any_of: ["keyword or product targeting", "targeting"]
      - any_of: ["match type"]
      - all_of: ["impressions", "clicks"]
      - any_of: ["spend", "cost"]
    distinguishing:
      - any_of: ["keyword id", "top-of-search impression share"]
    negative:
      - ["customer search term", "advertised asin", "advertised sku"]

  searchterm:
    required:
      - any_of: ["date", "start date"]
      - any_of: ["campaign id", "campaign name"]
      - any_of: ["customer search term"]
      - all_of: ["impressions", "clicks"]
      - any_of: ["spend", "cost"]
    distinguishing:
      - any_of: ["keyword or product targeting", "targeting"]
    negative:
      - ["advertised asin", "advertised sku"]

  placement:
    required:
      - any_of: ["date", "start date"]
      - any_of: ["campaign id", "campaign name"]
      - any_of: ["placement"]
      - all_of: ["impressions", "clicks"]
      - any_of: ["spend", "cost"]
    distinguishing: []
    negative:
      - ["ad group id", "ad group name", "customer search term",
         "advertised asin", "advertised sku"]

  advertised_product:
    required:
      - any_of: ["date", "start date"]
      - any_of: ["campaign id", "campaign name"]
      - any_of: ["advertised asin", "asin"]
      - any_of: ["advertised sku"]
      - all_of: ["impressions", "clicks"]
      - any_of: ["spend", "cost"]
    distinguishing:
      - any_of: ["ad group id", "ad group name"]
    negative:
      - ["customer search term", "purchased asin", "other asin"]

  purchased_product:
    required:
      - any_of: ["date", "start date"]
      - any_of: ["campaign id", "campaign name"]
      - any_of: ["advertised asin"]
      - any_of: ["purchased asin", "other asin"]
      - all_of: ["impressions", "clicks"]
      - any_of: ["spend", "cost"]
    distinguishing: []
    negative: []

# 报表类型变体（D11 源适配）：与 report_types 同规则打分，胜出后映射到 canonical 主类型。
# 用途：同一 canonical 表收多源同构报表（如领星中文 target 行 → target 表）。
#   maps_to:       命中后的 canonical report_type（必须存在于 report_types）
#   其余字段（required/distinguishing/negative）与 report_types 语义一致，列名为字面归一化名
report_variants:
  lingxing_daily_target:
    maps_to: target
    required:
      - any_of: ["日期"]
      - any_of: ["广告活动"]
      - any_of: ["投放"]
      - all_of: ["曝光量", "点击"]
      - any_of: ["花费-本币", "花费", "花费-美元"]
    distinguishing:
      - any_of: ["匹配方式"]
    negative: []

  # D11 二期（2026-11-15）：领星 MCP JSON 响应 · 按日拉取的活动报表
  # （ad_sp_campaign_report：行含 report_date/campaign_id/cost/sales，无 campaign_name，
  #   归属靠 CampaignMap 按 campaign_id 登记）。窗口聚合 JSON（无任何日期键）不满足
  #   日期组 → unknown → 拒绝入库（适配器行级再兜底显式拒绝，PRD 红线不虚构日期）。
  lingxing_mcp_daily_campaign:
    maps_to: campaign
    required:
      - any_of: ["report date", "date"]
      - any_of: ["campaign id", "campaign name"]
      - all_of: ["impressions", "clicks"]
      - any_of: ["cost", "spend"]
    distinguishing:
      - any_of: ["profile id", "same orders", "same sales", "same units"]
    negative: []

# 置信阈值（设计 §2.3；无区分列配置的类型区分项视为满足，见 detector.py 实现注记）
confidence_threshold: 0.85
margin: 0.1
