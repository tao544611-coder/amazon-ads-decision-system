[project]
name = "ads-core"
version = "0.11.0"
description = "Amazon Ads optimization & decision system - stage 1 core engine"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
ads = "ads_core.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ads_core*"]

[tool.setuptools.package-data]
ads_core = ["ingest/fingerprints.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
