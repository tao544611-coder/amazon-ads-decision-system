# ============================================================================
# 第一层 · 程序硬规则（hard_rules）
# 由程序执行（导入门禁 / 指标计算 / 建议校验器 / 观察验收），不依赖大模型解释。
# enforcement 取值：
#   ingest_gate    —— 数据导入/事实计算阶段强制
#   validator      —— AI 建议校验器强制（不通过则建议不得进待批）
#   acceptance     —— 效果验收阶段强制
# ============================================================================
hard_rules:
  - id: HR-01
    name: 转化侧数据成熟度门禁
    statement: >-
      相对取数日按点击日回推：SP 点击日距今 < 7 天、SB/SD < 14 天的日子，其
      orders / sales / ACOS / CVR 视为未成熟，不得进入正式经营结论、环比定论、
      疗效判定、否词/暂停待批或遗漏风险清单，须标记「未成熟观察」。
      花费与点击不受归因回填影响，可用于结构/断崖初判，但须脚注「转化侧未成熟」。
    source: {section: "§2.4", block: "30310a32-f0a1-4879-9aca-1b55e8d1ba31"}
    enforcement: ingest_gate

  - id: HR-02
    name: SP+SB 混算从严
    statement: >-
      组内 SP+SB 混算时以更严一侧为准（含 SB 则按 14 天），或 SP/SB 分列后再下结论；
      禁止用未成熟混算 ACOS 做疗效或环比定论。
    source: {section: "§2.4", block: "ff655c4f-42d0-4ff1-8d18-040758acfa47"}
    enforcement: ingest_gate

  - id: HR-03
    name: 环比成熟度对称
    statement: >-
      环比/跨窗对比两侧须同成熟度（都成熟，或都标明未成熟且不作定论）；
      禁止「上期已满窗、本期未满窗」的裸 ACOS 环比下红灯；不对称时只标观察。
    source: {section: "§2.3 / §2.4", blocks: ["3f5c1b22-ae72-4c97-a06d-779124b90911", "8aa84389-1e14-49a9-81ee-7bb68e61f06c"]}
    enforcement: ingest_gate

  - id: HR-04
    name: T-2 取数窗（且不等于成熟度）
    statement: >-
      周检取数窗 T-2（end_offset_days=2）只挡「进报表最多约 12 小时」的延迟；
      不把最近 7/14 天当成已成熟转化数据。
    source: {section: "§2.4", block: "bc3704d0-fcb0-4496-a612-1fe6050ff518"}
    enforcement: ingest_gate

  - id: HR-05
    name: 零转化否词/暂停进单门槛
    statement: >-
      样本跑满且订单=0：底表可用 spend ≥ £2 做零转化雷达初筛；但进入上层待批或
      遗漏风险清单的否词/暂停候选，必须同时满足（订单仍为 0）之一：
      ① Clicks ≥ 组平均出单点击数（= 1/组 CVR；缺组 CVR 时默认约 10～12 次点击）；
      ② 单项花费 ≥ £5.00。
      点击 < 8 次、且仅因 spend ≥ £2 入雷达的零转化词，必须标「样本不足观察」，
      严禁列入遗漏风险清单，也不得单独进否词/暂停待批。
    source: {section: "§3.2 第2条", block: "dd0e542b-d885-4269-980c-61ee2e6076d1"}
    enforcement: validator

  - id: HR-06
    name: 零转化候选的归因成熟度附加门禁
    statement: >-
      与 HR-05 并列：该词观察窗内点击日距取数日未满 §2.4（SP 7 天 / SB·SD 14 天；
      组含 SB 从严）时，即使点击/花费已过门槛，仍须标「未成熟观察」，严禁进
      遗漏风险清单与否词/暂停待批——订单可能仍在回填。
    source: {section: "§3.2 第2条（并列）", block: "dd0e542b-d885-4269-980c-61ee2e6076d1"}
    enforcement: validator

  - id: HR-07
    name: 执行级 bid 样本门槛
    statement: >-
      观察窗（建议 30 天）点击 < 20 → 标「继续观察」，不出执行级调价建议。
      （Gordon 2026-10-30：由 30 改为 20。）该门槛只管「是否调 bid」，
      与零转化门槛（HR-05）用途不同、勿混；两者可同时成立。
    source: {section: "§3.3 默认护栏", block: "34ca1193-e7ee-4e1b-94cc-3c701881a728"}
    enforcement: validator

  - id: HR-08
    name: 单次 bid 变动护栏
    statement: 单次建议变动相对当前 bid 约 ≤ ±15%；更大步长须在待批里写明理由与回滚。
    source: {section: "§3.3 默认护栏", block: "c54ab134-247a-498d-af06-b2d76869baad"}
    enforcement: validator

  - id: HR-09
    name: UK 出价上下沿
    statement: >-
      单次建议出价夹在 min≈£0.10 / max≈£2.00（GBP；不适用 USD 文档默认 max≈5）。
      越界须在待批写明理由。
    source: {section: "§3.3 默认护栏", block: "2e1e6de3-5678-4e2b-bb33-a9788f6b2060"}
    enforcement: validator

  - id: HR-10
    name: 未成熟日不进 CVR 加权
    statement: >-
      未满 §2.4 成熟度的日子不进转化侧加权（该窗权重归零后重归一化）；
      未成熟 CVR 不得进执行级 bid 口径块。
    source: {section: "§3.3 估 CVR", block: "f4c65447-9c02-4d80-a807-b3be33ccbe50"}
    enforcement: ingest_gate

  - id: HR-11
    name: 结构问题优先（冲突消解先于公式）
    statement: >-
      §3.0 结构问题未解（好线 ACOS 低但 OUT_OF_BUDGET + 差线仍烧）→
      不采纳 / 不出执行级 bid 建议；先挪预算或停差线。
    source: {section: "§3.3 冲突消解", block: "7d867a28-5338-479b-a1cd-4378874e52b2"}
    enforcement: validator

  - id: HR-12
    name: 零转化优先于微调 bid
    statement: >-
      零转化且满足 §3.2 第 2 条（HR-05）→ 仍优先否/停，不优先微调 bid；
      公式与护栏不得覆盖本条与 HR-11。
    source: {section: "§3.3 冲突消解", blocks: ["a5f06e6a-805b-4b62-82e9-ee48bae4cd86", "9e205dd5-6cc3-46a7-a6f0-47962efca42a"]}
    enforcement: validator

  - id: HR-13
    name: 花费与 ACOS 口径不混加
    statement: >-
      白名单组花费（L19 后）= 原 SP/SD（product 层）+ 归属该组的 SB；
      禁把清单外 SB（如 GGBDWKAOP-BRJZ*）并入。SP/SD-only 口径（如 W43 33.90%）
      与 L19 后含 SB 的 ACOS 禁止裸比，须分列或脚注。
      利润侧 spend 用 A4：finance_page_list_msku · sids=[17570] 按 ASIN 进组，
      与广告 spends 分列；禁无 sid / 旧 6 位 MSKU 主路径。
      「广告花费 vs 毛利/销售额」仅限同店（昕信 profile）同窗展示。
    source: {section: "§2.2", block: "d1e879ad-85a4-4563-b1c0-9bee8b47db82"}
    enforcement: ingest_gate

  - id: HR-14
    name: 事实/推断/待验证三分；缺数不编造
    statement: >-
      事实 / 推断 / 待验证分开写；缺数写「今天拿不到」，不编造。
      出处与口径（后台/领星/ERP/外盘工具）对不齐就不硬拼、不混加。
    source: {section: "§1 第2、3条", blocks: ["d61590d1-1158-4c5a-aa6e-248d4a455e68", "547c9944-7a22-429e-8a2b-269fe9a2e8cb"]}
    enforcement: validator   # 校验器强制建议的证据字段分层与缺数标注

  - id: HR-15
    name: 待批四件套完整性
    statement: >-
      每条动作必带：证据 → 预期影响 → 风险与回滚 → 验证窗（多为 7 天或下期周检）。
      缺任一件不得进入待批。
    source: {section: "§1 第5条", block: "73147d60-6b69-42ea-bd67-b2c526a74927"}
    enforcement: validator

  - id: HR-16
    name: 词级 bid 建议口径块完整性
    statement: >-
      若本条动作含调 bid：附件或待批正文须显式写出 目标 ACOS、CVR 观察窗与权重、
      先验/大盘 CVR（若用了收缩）、护栏参数（如 ±15%、点击门槛）——等同可复核的
      summary 口径块；缺一块则该建议不得标「可执行」。
    source: {section: "§1 第6条", block: "5b45411d-9af4-4a8b-8e17-a60d636c6070"}
    enforcement: validator

  - id: HR-17
    name: H1 执行边界
    statement: >-
      建议 ≠ 已批 ≠ 已执行；默认只读 MCP；不花钱取数先问。
      禁止自动写广告/卖家后台（H1：仅 Gordon）。批量算价脚本算出价只进待批。
    source: {section: "§0 / §3.3 边界", blocks: ["7065d91d-52d9-4827-9351-0ff8f56db6ea", "919661e4-d9b1-4fe3-a9d0-8ca066fde491"]}
    enforcement: validator   # 对应系统权限模型：AI 写入口仅建议/观察/经验

  - id: HR-18
    name: 验收窗成熟度
    statement: >-
      处置后「挂下周周检」时，单量/ACOS 正式结论须等对应点击日满归因窗后再给；
      未满前只报花费/点击与「未成熟观察」。
    source: {section: "§2.4 验收窗", block: "3954e1e7-edf5-452d-8dc8-6e07d678e5ba"}
    enforcement: acceptance

  - id: HR-19
    name: 周检事实层前置
    statement: >-
      上层分析前须有事实层（box 事实表 reviews/ads-weekly-audit/facts/YYYY-Www_facts.md；
      规程 chains/fact-then-judge.md §1）——「事实层→判断层」同批落地；
      禁止判断层另起一套 KPI。
    source: {section: "页首周检事实层（2026-10-28 Gordon 批）", block: "05ccefe6-a2bc-4753-838d-98275a48cab4"}
    enforcement: ingest_gate   # 系统落地=分析上下文包必须引用已生成的事实批次

# ============================================================================
# 第二层 · 业务参数（parameters）
# 经审核可配置；例外须写理由（非死公式）。
# ============================================================================
parameters:
  target_acos:
    default: 0.25                     # 目标 ACOS 默认 25%
    exceptions_note: "SKU/活动级例外（如 6979 深灰「暂不停」）正式归属产品档案（F3 决议：PRD 4.2 B 经营目标 / F 特殊规则），此处仅索引方法论原文提及的例外"
    exceptions_index:                  # 原文索引（正式配置在产品档案维护）
      - {scope: "SKU 6979 深灰（新品/观察款）", rule: "暂不停", source: "§3 页首"}
    source: {section: "§3 页首", block: "7e2908d1-73de-48f3-be07-4ae1e1e52556"}

  attribution_maturity:
    sp_min_days: 7                     # SP（卖家）：点击日距取数日 ≥7 天 → 成熟
    sb_sd_min_days: 14                 # SB / SD：≥14 天 → 成熟
    mixed_policy: stricter             # 混算从严（含 SB 按 14 天）或分列
    basis: "Amazon Ads「Ad campaign attribution」：按点击日记转化；SP 回溯约 7 天、品牌类约 14 天"
    source: {section: "§2.4", blocks: ["dfd282d6-6afc-4e22-a1a4-dfa1d2c175d5", "6f8c2cf8-699f-46d3-932e-e35c2c6e2f4f"]}

  data_window:
    t2_offset_days: 2                  # 周检取数窗 T-2（只挡进报表延迟，不代替成熟度）

  zero_conversion:
    radar_spend_gbp: 2.00              # 零转化雷达初筛：spend ≥ £2
    bar_clicks_rule: "1 / 组 CVR"      # 进单门槛①：Clicks ≥ 组平均出单点击数
    bar_clicks_default_range: [10, 12] # 缺组 CVR 时默认约 10～12 次点击
    bar_spend_gbp: 5.00                # 进单门槛②：单项花费 ≥ £5.00
    insufficient_sample_clicks: 8      # 点击 <8 且仅因 spend≥£2 入雷达 → 「样本不足观察」
    source: {section: "§3.2 第2条", block: "dd0e542b-d885-4269-980c-61ee2e6076d1"}

  bid_adjustment:
    observation_window_days: 30        # 观察窗（建议 30 天）
    min_clicks_for_bid_action: 20      # 点击 <20 → 「继续观察」（Gordon 2026-10-30 由 30 改 20）
    max_single_change_pct: 15          # 单次建议变动 ≤ ±15%
    uk_floor_gbp: 0.10                 # UK 出价上下沿
    uk_ceiling_gbp: 2.00               # 不适用 USD 文档默认 max≈5
    formula: "建议出价 ≈ 目标 ACOS × 预估 CVR × 客单价（恒等式，无拟合参数；仅解释与 sanity check 用，非自动执行）"
    source: {section: "§3.3", blocks: ["41cbc829-ed77-491e-b553-8f41e7b3df81", "34ca1193-e7ee-4e1b-94cc-3c701881a728", "c54ab134-247a-498d-af06-b2d76869baad", "2e1e6de3-5678-4e2b-bb33-a9788f6b2060"]}

  cvr_estimation:
    window_weights: {d7: 0.5, d14: 0.3, d30: 0.2}   # 近 7/14/30 日加权；某窗无数据 → 重归一化
    prior_group: whitelist_group       # 小样本对白名单组先验 CVR 收缩（Gordon 2026-10-26 定）
    prior_exclusions: "不用全店大盘、不按单 SKU"
    immature_day_policy: "未满 §2.4 的日子不进转化侧加权（权重归零后重归一）"
    source: {section: "§3.3 估 CVR", block: "f4c65447-9c02-4d80-a807-b3be33ccbe50"}

  acceptance:
    window_default: "7 天或下期周检"
    observation_window_policy: "实际观察窗 = max(默认验证窗(7 天或下期周检), 归因满窗(HR-01/02 的 SP 7 天 / SB·SD 14 天))——合成规则经 Gordon 2026-11-14 确认（F5）"
    weekly_deviation_review_pct: 20    # |实际−目标|/目标 > 20% → 标「需回看」
    source: {section: "§3.5 / §1 第5条", blocks: ["e0ec762d-6a45-4dec-bb3b-c7097c245251", "73147d60-6b69-42ea-bd67-b2c526a74927"]}

  store_scope:
    profile: "1531098959787693"        # 昕信主店
    sids: [17570]
