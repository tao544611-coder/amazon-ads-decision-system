# ============================================================================
# 第三层 · 运营知识（knowledge）
# 供 AI 分析与判断时参考；不构成程序强制。
# ============================================================================
knowledge:
  - id: K-01
    title: 分层分析框架（§2.1）
    body: >-
      店级锚：同窗 ad_campaign_report（含清单外、SP/SB 结构）。
      白名单雷达：products.md 分组（6384 / 6978_6979 等）≠ 昕信全店花费。
      活动/色：结构问题（高效线顶预算 + 低效线仍烧）vs 单纯加预算。
      关键词/零转化：否词、暂停、降 bid 的证据层。
    source: {section: "§2.1", blocks: ["ce0c1d17-cca8-49ae-9936-3c4ea27edcd4", "6cff684b-1340-4371-99b0-4d33de26ba62", "fbef57b3-584a-4bad-a48a-a9783f755a3d", "f986baab-04c1-43e1-a474-33a849bc322d"]}

  - id: K-02
    title: 问题类型三分与处置原则（§3.0）
    body: >-
      结构问题（好线 ACOS 低但 OUT_OF_BUDGET，差线仍烧）→ 优先挪预算/停差色差词；
      禁止先整体加日预算。量的问题（好线有余量、组 ACOS 近目标、量不够）→
      才考虑加预算或略抬 bid。状态断崖（花费骤降）→ 先查 paused/断货，再谈加钱或恢复。
    source: {section: "§3.0", block: "5e87a0fc-d0a6-48de-8e69-f4825e341c57"}

  - id: K-03
    title: 每日预算/开关决策表（§3.1）
    body: >-
      高效活动（如 Core Exact ACOS ~18%）频繁顶预算 → 加预算或从低效线挪来，先解决顶预算；
      低效活动（如 Phrase ACOS 70%+）仍烧 → 减预算或关，不与高效线「整体加」；
      整活动开关仅当多数词差或需一刀切，否则优先词级；
      恢复已 paused 默认不恢复，若恢复先 Exact/Auto、Phrase 后置，防多组抢预算。
    source: {section: "§3.1", block: "462cb148-e797-4183-9531-ed99ea047820"}

  - id: K-04
    title: 否词/暂停由轻到重（§3.2）
    body: >-
      有转化但偏贵 → 先降 bid，不否不停；Phrase/Auto 垃圾大词 → 精确否定优先于整活动停；
      否词分档（不依赖活动启停的可立即做；挂「可能整停」活动上的先确认活动是否还开）；
      过宽风险：短头词须标「可能误杀」，建议拍板或挂下周回看主词订单；
      Exact 上可逆性要求高时，满足门槛且已成熟者优先「暂停投放」而非永久否词。
    source: {section: "§3.2", blocks: ["ca480e01-73dc-4b1f-86b3-34fc0b0faef1", "058d0642-6925-4bf4-9a6b-1743a1c31b97", "819d42aa-26f6-43fd-9361-3dae9df3763f", "69104c07-cfd3-4da4-9e07-84ca85d4e9b7", "dd0e542b-d885-4269-980c-61ee2e6076d1"]}

  - id: K-05
    title: bid 决策入口与「无死公式」（§3.3）
    body: >-
      ACOS 明显高于目标但仍有单 → 下调 bid，写验收窗；ACOS 好且常顶预算 → 优先加预算，
      不先狂加 bid；ACOS 差且 0 单 → 走暂停/否词，不纠结微调 bid；
      CPC 环比猛涨 → 先查竞争/匹配/是否只剩贵点击；无「固定降 20%」死公式。
      恒等式仅解释「为何建议降/抬」与 sanity check，不把公式输出当作已批后台出价。
    source: {section: "§3.3", blocks: ["526787d3-d6a1-47b0-ae5d-a6df05cfbe61", "c9659809-b59e-411a-ac98-f297214676c9", "f25ae584-b500-4c1c-be94-2310ebc82bfb", "690caada-58ca-4f54-8512-aaeec05077fa"]}

  - id: K-06
    title: 投放模式偏好（§3.4）
    body: >-
      控 ACOS 的 Core 转化词 → Exact（或窄匹配）+ 相对保守竞价；
      拓词且可接受更高 ACOS → Phrase/Auto + 零转化巡检与否词；
      up-and-down vs down-only：ACOS 已超目标或结构仍乱 → 更保守（偏 down only/偏低），
      余量大要冲量才更激进；精细旋钮可交投手，本岗写清对组 ACOS/销量的影响。
    source: {section: "§3.4", blocks: ["0263bec6-c7fc-4af3-a6b7-c44b1e8df9b2", "0579d895-a9fa-4a25-9ac4-57777f73fef5", "a493aa35-daa3-43a4-b4e5-f40824b9447a"]}

  - id: K-07
    title: 验收判定（§3.5）
    body: >-
      有效：同口径下 ACOS 改善且订单未塌（或花费降而销售持稳）。
      需再调：同口径 ACOS 继续恶化，或主词/组合订单明显掉且无品类理由（仍由 Gordon 改后台，H1）。
      周偏差回看（可选量化）：|实际 ACOS − 目标 ACOS|/目标 > 20% → 标「需回看」，
      复核 CVR 窗、失效条件、结构；与定性并列，不替代待批四件套的验证窗表述。
    source: {section: "§3.5", blocks: ["03b29611-86bf-44b9-926e-926d3a1511db", "b065695b-a91e-4e5f-9933-ace16ae6cbfb", "e0ec762d-6a45-4dec-bb3b-c7097c245251"]}

  - id: K-08
    title: 归因拆解铁律（§1 第7条，2026-10-29 补）
    body: >-
      凡解释跨期、跨窗或变体间的 ACOS 差异，必须显式对比 CPC（点击单价）、
      CVR（转化率）、ASP（客单价）三个中间量，并指出真实底层驱动；
      严禁「可能效率在修」「主因可能含结构微调」等无指标支撑的猜测性表述。
      中间量须与事实表（或同窗 raw）的 Clicks/Spend/Orders/Sales 列可复核对齐；
      缺任一列写「今天拿不到该中间量」。
    source: {section: "§1 第7条", block: "c79026eb-21f9-431f-8074-1246395596a8"}

  - id: K-09
    title: 证据强度与结论边界（§1 第8条）
    body: >-
      满足时间窗口和样本门槛只代表可进入相应流程，不代表结论必然可靠；
      须结合订单量、数据波动和同期变化判断证据强度，小样本或波动大时标观察。
      前后指标变化只能证明指标变化，不能自动证明由某项操作造成；
      须检查同期价格、促销、库存、Listing、流量及竞争变化。
      CTR/CPC/CVR/ACOS/TACOS 和产品利润服务不同层级决策，不得用单一指标替代整体经营判断。
      证据不足时明确写出限制，不强行给出确定结论。
    source: {section: "§1 第8条", block: "cf725edf-6257-4b75-a1e4-ebe27c47f33c"}

  - id: K-10
    title: 失效再人工条件（§3.0/§3.3 脚注）
    body: >-
      出现下列情况后，既有 bid 建议或模型结论视为失效，须重新取证再出待批：
      断货或可售骤降；跟卖/竞品明显压价；换主图或改售价；高客单订单严重滞后于点击窗；
      新品冷启动样本不足。结构未解时，禁止用「调 bid」代替挪预算或停差线。
    source: {section: "§3.0 / §3.3", blocks: ["e34f9c2c-158f-4c07-a947-e0234fd8c583", "5622224d-0d8a-41e6-a312-68701b325575"]}

  - id: K-11
    title: 异常判定与环比纪律（§2.3）
    body: >-
      环比阈值（ACOS/CPC/花费断崖）→ 回查活动/词状态（paused vs 断货）；
      零基数周不当「全绿」（防假阴性）；处置后挂下周窗验收（例：2026-10-26 词级处置 → W44），
      单量/ACOS 正式结论须满足 §2.4 成熟度。
    source: {section: "§2.3", blocks: ["5e21a030-0182-4937-b5a5-306291ae4859", "8e4d644b-7864-4cdc-a9b8-be52be46a2d2", "40d7c4e5-e331-4ed5-94bf-04d71ba2e58f"]}

  - id: K-12
    title: 交付顺序与最少数据原则（§1 第1、4条）
    body: >-
      先复用已有周检/抽检/台账/上层分析，缺什么再补最少数据。
      交付顺序：结论 → 关键证据 → 建议动作 → 待确认；无显著异常只回一句收口。
    source: {section: "§1 第1、4条", blocks: ["1652c8df-f430-46bf-a63b-1d7ba8c8c1c6", "fd9acb65-2c6c-4d2c-8d65-26eddbcf74b9"]}

  - id: K-13
    title: 适用范围与转交边界（§0）
    body: >-
      适用：白名单与店级广告花费/ACOS/结构诊断；周检上层分析、词级/活动级待批建议；
      毛利×广告同店同窗对照（A4）；处置后验收清单。
      转交：日常前台巡检（助理）；PPC 专项操盘细则（「合理烧钱的广告投手」，本岗量化经营影响）；
      SKU 利润费用核算（财务）；补货（供应链）；写广告/卖家后台（H1：仅 Gordon）。
    source: {section: "§0", block: "cf95115f-696e-461e-8252-881e4b7ec8a6"}

  - id: K-14
    title: 词级 bid 取数方式（§3.3）
    body: >-
      优先领星 MCP 导与恒等式同口径的 Targeting/关键词日报（或等价），由运营数据分析操作；
      亦可基于历史已落盘累积数据提取/计算。取数结果写清窗与出处；
      若 MCP/接口出现费用或额度异常，先报 Gordon。
    source: {section: "§3.3 取数", block: "cee57a22-68be-44da-925e-bcbb1b681d07"}

